<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e6e45">
<meta name="robots" content="noindex">
<title>Cours — Cartopoint</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="fatal" class="banner" role="alert" hidden></div>

<header class="top">
  <a class="btn ghost sm" href="/prof">← Mes cours</a>
  <div class="brand">
    <div class="brand-mark" data-brand-icon></div>
    <div>
      <h1 id="pageTitle"></h1>
      <p id="mapName"></p>
    </div>
  </div>
  <span class="save-state" id="saveState" role="status"></span>
  <button class="btn sm" id="publishTop" type="button">Publier</button>
</header>

<div id="saveBanner" class="banner save-banner" role="alert" hidden>
  <span id="saveBannerText"></span>
  <a class="btn ghost sm" id="saveLogin" href="/prof" target="_blank" rel="noopener" hidden>Se reconnecter</a>
  <button class="btn sm" id="saveRetry" type="button">Réessayer</button>
</div>

<div class="layout">
  <main class="stage"><div class="stage-inner" id="stageInner">
    <div class="stage-bar">
      <div class="progress" id="progress"></div>
      <div class="legend">
        <span id="legendRef"><i class="lg-ref"></i>Position réelle</span>
      </div>
    </div>
    <div class="map-frame" id="mapFrame">
      <img id="plan" alt="Plan du site">
      <div class="plan-empty" id="planEmpty" hidden>
        <p>Cette carte n'a pas encore d'image du plan.</p>
        <button class="btn" type="button" id="planChoose">Choisir l'image du plan</button>
      </div>
      <svg class="map-lines" id="mapLines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
    <div class="place-hint" id="placeHint" hidden><span id="placeHintText"></span><button type="button" id="placeCancel">Annuler</button></div>
  </div></main>

  <aside class="panel" id="panel" aria-label="Fiches"></aside>
</div>

<!-- Édition d'une fiche -->
<dialog id="dlgEdit">
  <div class="dlg">
    <div class="dlg-head"><h2 id="editTitle">Fiche</h2><button class="x" type="button" data-close aria-label="Fermer">×</button></div>
    <div class="dlg-body">
      <label class="check"><input type="checkbox" id="eVisible"> Visible dans l'espace élèves</label>
      <div class="form-grid">
        <div class="field"><label for="eRef">Réf. photo (étiquette sur le terrain)</label><input id="eRef" placeholder="12b"><span class="hint">Le numéro vu par les élèves est automatique.</span></div>
        <div class="field"><label for="eCommon">Nom commun</label><input id="eCommon" placeholder="Olivier"></div>
        <div class="field"><label for="eSpecies">Nom scientifique</label><input id="eSpecies" placeholder="Olea europaea"></div>
        <div class="field"><label for="eFamily">Famille</label><input id="eFamily" placeholder="Oleaceae"></div>
        <div class="field"><label for="eDate">Date d'observation</label><input id="eDate" type="date"></div>
        <div class="field"></div>

        <div class="field wide needs-edit">
          <div class="needs-head"><h3>Besoins</h3><span class="hint">Cliquez dans une case, puis sur un émoji pour l'ajouter</span></div>
          <div class="emoji-bar" id="emojiBar" role="toolbar" aria-label="Émojis"></div>
          <div class="needs-grid">
            <div class="field"><label for="eExposure">☀️ Exposition</label><textarea id="eExposure" rows="2" placeholder="☀️☀️☀️ Plein soleil"></textarea></div>
            <div class="field"><label for="eWatering">💧 Arrosage</label><textarea id="eWatering" rows="2" placeholder="💧 Faible une fois installé"></textarea></div>
            <div class="field"><label for="eSoil">🌱 Sol</label><textarea id="eSoil" rows="2" placeholder="Léger, bien drainé"></textarea></div>
            <div class="field"><label for="eHeat">🌡️ Chaleur</label><textarea id="eHeat" rows="2" placeholder="Très bonne tolérance · ❄️ jusqu'à -10 °C"></textarea></div>
            <div class="field wide"><label for="eCare">✂️ Entretien</label><textarea id="eCare" rows="2" placeholder="Taille légère après floraison"></textarea></div>
          </div>
        </div>

        <div class="field wide"><label for="eDesc">Description</label><textarea id="eDesc"></textarea></div>
        <div class="field wide"><label for="eNotes">Observations de terrain</label><textarea id="eNotes"></textarea></div>
      </div>
      <div class="section">
        <div class="inline spread">
          <h3>Photos et vidéos</h3>
          <div class="inline">
            <label class="btn soft sm file-btn">＋ Ajouter<input id="eFiles" type="file" accept="image/*,video/*" multiple></label>
          </div>
        </div>
        <p class="hint" id="uploadStatus"></p>
        <div class="gallery" id="eGallery"></div>
      </div>
    </div>
    <div class="dlg-foot">
      <button class="btn danger spacer" type="button" id="eDelete">Supprimer la fiche</button>
      <button class="btn ghost" type="button" data-close>Annuler</button>
      <button class="btn" type="button" id="eSave">Enregistrer</button>
    </div>
  </div>
</dialog>

<!-- Visionneuse photo plein écran -->
<dialog id="dlgPhoto" class="photo-dlg" aria-label="Photo">
  <div id="photoStage" class="photo-stage">
    <img id="photoImg" alt="">
    <button type="button" class="pv prev" id="photoPrev" aria-label="Photo précédente">‹</button>
    <button type="button" class="pv next" id="photoNext" aria-label="Photo suivante">›</button>
    <button type="button" class="x photo-x" id="photoClose" aria-label="Fermer">×</button>
    <span class="photo-count" id="photoCount"></span>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p class="banner">Cette page a besoin de JavaScript.</p></noscript>
<script type="module" src="/js/prof/course.js"></script>
</body>
</html>
