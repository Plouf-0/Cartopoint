services:
  inventaire:
    build:
      context: .
      args:
        # La version affichée sur les pages : APP_VERSION=$(git rev-parse --short HEAD) docker compose up -d --build
        APP_VERSION: ${APP_VERSION:-}
    restart: unless-stopped
    user: "1001:1001" #changer selon l'utilisateur et le groupe souhaités
    # ports:
    #   - "8080:8080"
    networks:
      - traefik_network
    environment:
      # Mot de passe demandé dans l'application pour « Publier les modifications ».
      # Sans cette variable, la publication est désactivée.
      PUBLISH_PASSWORD: ${PUBLISH_PASSWORD:-}
      # 1 derrière un proxy (Traefik) : l'IP du client est lue dans X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Créent le compte admin au premier démarrage, s'il n'existe pas.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./data:/data


networks:
  traefik_network:
    external: true