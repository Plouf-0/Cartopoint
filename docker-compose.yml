# Exemple de déploiement. Placez un proxy HTTPS devant (Caddy, Traefik, nginx…).
services:
  inventaire:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Mot de passe demandé dans l'application pour « Publier les modifications ».
      # Sans cette variable, la publication est désactivée.
      PUBLISH_PASSWORD: "change-moi"
    volumes:
      - ./data:/data
